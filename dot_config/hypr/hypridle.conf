general {
    lock_cmd = /home/dmitrylito/.config/hypr/scripts/lock.sh                      # lock screen and 1password (disables LG while locked)
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true /home/dmitrylito/.config/hypr/scripts/lock.sh    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

listener {
    timeout = 60
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Unlocked: display off after 10 minutes (comfortable while working).
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock the system after 15 minutes. Lock-only so it doesn't schedule its own
# one-shot dpms-off; the DPMS listener above owns display power.
listener {
    timeout = 900
    on-timeout = OMARCHY_LOCK_ONLY=true /home/dmitrylito/.config/hypr/scripts/lock.sh
    on-resume = omarchy-system-wake
}
