general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Turn the display off after inactivity, timed by lock state (protects the OLED
# panel). Both listeners re-arm on every wake via on-resume, so the screen
# reliably powers back off even on the lock screen or after a wake-from-suspend.
#
# `pidof hyprlock` gates each action to one lock state: it exits success only
# while the lock screen is up, so `&&` runs only when locked and `||` only when
# unlocked. Exactly one of these two fires for any given idle stretch.

# Locked: display off after 1 minute (no reason to keep the panel lit).
listener {
    timeout = 60
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Unlocked: display off after 10 minutes (comfortable while working).
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock the system after 15 minutes. Lock-only so it doesn't schedule its own
# one-shot dpms-off; the DPMS listener above owns display power.
listener {
    timeout = 900
    on-timeout = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    on-resume = omarchy-system-wake
}
