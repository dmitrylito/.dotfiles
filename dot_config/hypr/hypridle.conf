general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Turn the display off after 5 minutes of inactivity (protects the OLED panel).
# Dedicated DPMS listener re-arms on every wake, so the screen reliably goes
# back off even while sitting on the lock screen or after a wake-from-suspend.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock the system after 15 minutes. Lock-only so it doesn't schedule its own
# one-shot dpms-off; the DPMS listener above owns display power.
listener {
    timeout = 900
    on-timeout = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    on-resume = omarchy-system-wake
}
