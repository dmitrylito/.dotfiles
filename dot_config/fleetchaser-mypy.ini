; mypy config for the fleetchaser backend (Django-aware via django-stubs plugin).
; Used by the fc-mypy wrapper and nvim-lint. Lenient starter posture: the
; codebase is largely unannotated, so we don't dive into untyped bodies yet.
[mypy]
plugins = mypy_django_plugin.main
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
cache_dir = ~/.cache/fleetchaser-mypy

[mypy.plugins.django-stubs]
django_settings_module = fleetchaser.settings
