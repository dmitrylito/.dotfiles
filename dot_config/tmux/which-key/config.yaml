# yaml-language-server: $schema=config.schema.yaml
command_alias_start_index: 200
keybindings:
  # root_table: C-Space
  prefix_table: Space
title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=green,align=centre,bold
position:
  x: R
  y: P
custom_variables:
  - name: log_info
    value: "#[fg=green,italics] [info]#[default]#[italics]"
macros:
  - name: reload-config
    commands:
      - display "#{log_info} Loading config... "
      - source-file ~/.config/tmux/tmux.conf
      - display -p "\n\n... Press ENTER to continue"
  - name: restart-pane
    commands:
      - display "#{log_info} Restarting pane"
      - "respawnp -k -c #{pane_current_path}"
  - name: toggle-mouse
    commands:
      - set -g mouse
      - display "#{log_info} mouse #{?mouse,on,off} — off hands clicks back to Ghostty"
  - name: reset-mouse
    commands:
      - mouse-reset
      - display "#{log_info} mouse reset"
items:
  - name: Run
    key: space
    command: command-prompt
  - name: Last window
    key: tab
    command: last-window
  - name: Last pane
    key: "`"
    command: last-pane
  - name: Copy
    key: c
    menu:
      - name: Copy
        key: c
        command: copy-mode
      - name: List buffers
        key: "#"
        command: list-buffers
  - name: Open URL
    key: u
    command: "display-popup -E -w 80% -h 60% ~/.config/tmux/url_picker.sh"
  - name: Lazygit
    key: g
    command: 'display-popup -d "#{pane_current_path}" -E -w 90% -h 90% lazygit'
  - name: Session launcher
    key: a
    command: "display-popup -E -w 80% -h 70% ~/.config/tmux/sesh_launcher.sh"
  - name: Toggle mouse
    key: m
    macro: toggle-mouse
  - name: Reset mouse
    key: M
    macro: reset-mouse
  - separator: true
  - name: +Windows
    key: w
    menu:
      - name: Last
        key: tab
        command: last-window
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Previous
        key: p
        command: previous-window
      - name: Next
        key: n
        command: next-window
      - name: New
        key: c
        command: "neww -c #{pane_current_path}"
      - separator: true
      - name: +Layout
        key: l
        menu:
          - name: Next
            key: l
            command: nextl
            transient: true
          - name: Tiled
            key: t
            command: selectnl tiled
          - name: Horizontal
            key: h
            command: selectl even-horizontal
          - name: Vertical
            key: v
            command: selectl even-vertical
          - name: Horizontal main
            key: H
            command: selectl main-horizontal
          - name: Vertical main
            key: V
            command: selectl main-vertical
      - name: Split horizontal
        key: /
        command: "splitw -h -c #{pane_current_path}"
      - name: Split vertical
        key: "-"
        command: "splitw -v -c #{pane_current_path}"
      - name: Rotate
        key: o
        command: rotatew
        transient: true
      - name: Rotate reverse
        key: O
        command: rotatew -D
        transient: true
      - separator: true
      - name: Split below (h)
        key: h
        command: "splitw -v -c #{pane_current_path}"
      - name: Split right (v)
        key: v
        command: "splitw -h -c #{pane_current_path}"
      - name: Dev layout (tmuxifier)
        key: D
        # No single quotes in any command: build.py wraps each menu in '...', so a
        # literal ' ends the wrapper early and the whole set-option fails to parse.
        command: 'run-shell "~/.tmuxifier/bin/tmuxifier load-window Dev"'
      - name: +Go to
        key: g
        menu:
          - name: Window 1
            key: "1"
            command: "selectw -t :1"
          - name: Window 2
            key: "2"
            command: "selectw -t :2"
          - name: Window 3
            key: "3"
            command: "selectw -t :3"
          - name: Window 4
            key: "4"
            command: "selectw -t :4"
          - name: Window 5
            key: "5"
            command: "selectw -t :5"
          - name: Window 6
            key: "6"
            command: "selectw -t :6"
          - name: Window 7
            key: "7"
            command: "selectw -t :7"
          - name: Window 8
            key: "8"
            command: "selectw -t :8"
          - name: Window 9
            key: "9"
            command: "selectw -t :9"
      - name: +Move to
        key: M
        menu:
          - name: Position 1
            key: "1"
            command: "swapw -d -t :1"
          - name: Position 2
            key: "2"
            command: "swapw -d -t :2"
          - name: Position 3
            key: "3"
            command: "swapw -d -t :3"
          - name: Position 4
            key: "4"
            command: "swapw -d -t :4"
          - name: Position 5
            key: "5"
            command: "swapw -d -t :5"
          - name: Position 6
            key: "6"
            command: "swapw -d -t :6"
          - name: Position 7
            key: "7"
            command: "swapw -d -t :7"
          - name: Position 8
            key: "8"
            command: "swapw -d -t :8"
          - name: Position 9
            key: "9"
            command: "swapw -d -t :9"
      - separator: true
      - name: Rename
        key: R
        # Brace form, not "renamew -- \"%%\"": build.py escapes double quotes but
        # not an existing backslash, so \" becomes \\" and tmux ends the string early.
        command: command-prompt -I "#W" { renamew -- "%%" }
      - name: Kill
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'
      - name: Kill (no confirm, my k)
        key: k
        command: killw
  - name: +Panes
    key: p
    menu:
      - name: Last
        key: tab
        command: lastp
      - name: Choose
        key: p
        command: displayp -d 0
      - separator: true
      - name: Left
        key: h
        command: selectp -L
      - name: Down
        key: j
        command: selectp -D
      - name: Up
        key: k
        command: selectp -U
      - name: Right
        key: l
        command: selectp -R
      - separator: true
      - name: Zoom
        key: z
        command: resizep -Z
      - name: +Resize
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L
            transient: true
          - name: Down
            key: j
            command: resizep -D
            transient: true
          - name: Up
            key: k
            command: resizep -U
            transient: true
          - name: Right
            key: l
            command: resizep -R
            transient: true
          - name: Left more
            key: H
            command: resizep -L 10
            transient: true
          - name: Down more
            key: J
            command: resizep -D 10
            transient: true
          - name: Up more
            key: K
            command: resizep -U 10
            transient: true
          - name: Right more
            key: L
            command: resizep -R 10
            transient: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break
        key: "!"
        command: break-pane
      - separator: true
      - name: Mark
        key: m
        command: selectp -m
      - name: Unmark
        key: M
        command: selectp -M
      - name: Capture
        key: C
        command: capture-pane
      - name: Respawn pane
        key: R
        macro: restart-pane
      - name: Kill
        key: X
        command: 'confirm -p "Kill pane #P? (y/n)" killp'
      - name: Kill (no confirm, my x)
        key: x
        command: killp
  - name: +Buffers
    key: b
    menu:
      - name: Choose
        key: b
        command: choose-buffer -Z
      - name: List
        key: l
        command: lsb
      - name: Paste
        key: p
        command: pasteb
  - name: +Sessions
    key: s
    menu:
      - name: Choose
        key: s
        command: choose-tree -Zs
      - name: Launcher (sesh)
        key: a
        command: "display-popup -E -w 80% -h 70% ~/.config/tmux/sesh_launcher.sh"
      - name: New
        key: N
        command: new
      - name: Rename
        key: r
        command: rename
      - separator: true
      - name: Previous
        key: p
        command: switchc -p
      - name: Next
        key: n
        command: switchc -n
      - separator: true
      - name: +State (resurrect)
        key: S
        menu:
          - name: Save
            key: s
            command: "run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"
          - name: Restore
            key: r
            command: "run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh"
      - name: Kill
        key: X
        command: 'confirm -p "Kill session #S? (y/n)" kill-session'
  - name: +Client
    key: C
    menu:
      - name: Choose
        key: c
        command: choose-client -Z
      - name: Last
        key: l
        command: switchc -l
      - name: Previous
        key: p
        command: switchc -p
      - name: Next
        key: n
        command: switchc -n
      - separator: true
      - name: Refresh
        key: R
        command: refresh
      - name: +Plugins
        key: P
        menu:
          - name: Install
            key: i
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/install_plugins
          - name: Update
            key: u
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/update_plugins
          - name: Clean
            key: c
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/clean_plugins
      - name: Detach
        key: D
        command: detach
      - name: Suspend
        key: Z
        command: suspendc
      - separator: true
      - name: Reload config
        key: r
        macro: reload-config
      - name: Customize
        key: ","
        command: customize-mode -Z
  - separator: true
  - name: Time
    key: T
    command: clock-mode
  - name: Show messages
    key: "~"
    command: show-messages
  - name: +Keys
    key: "?"
    command: list-keys -N
