# Ansible settings for playbook.yml. Repo tooling — never deployed to $HOME
# (see .chezmoiignore). run_onchange_executable_install-packages.sh.tmpl points
# ANSIBLE_CONFIG here explicitly, because Ansible only auto-discovers a config in
# the CURRENT directory and chezmoi runs the script from an arbitrary cwd.

[defaults]
# Report by exception: this playbook is idempotent and covers three profiles, so
# a synced machine is almost entirely ok= and skipped=. Hiding both turns a
# no-op run into a ~6-line recap while leaving changed/failed fully visible with
# their error output — verified, not assumed. Raise with -v when debugging.
display_ok_hosts = False
display_skipped_hosts = False

# Noise that says nothing about this run.
interpreter_python = auto_silent
deprecation_warnings = False
localhost_warning = False
action_warnings = False
retry_files_enabled = False

# One host, one file; a fork pool buys nothing and muddies output ordering.
forks = 1

[privilege_escalation]
# Tasks opt in individually via become:; never escalate implicitly.
become = False
