---
- name: Bootstrap and Sync Packages
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # 1. Base terminal essentials defined in YAML (Option B)
    # These are installed on ANY Linux system (Omarchy or server)
    common_linux_packages:
      - git
      - zsh
      - tmux
      - neovim
      - ripgrep
      - fzf
      - bat
      - eza
      - yazi
      - lazygit

    # Paths to Mac-specific auto-generated lists
    mac_brew_file: "{{ chezmoi_source_dir }}/packages-mac-brew.txt"
    mac_cask_file: "{{ chezmoi_source_dir }}/packages-mac-casks.txt"
    mac_taps_file: "{{ chezmoi_source_dir }}/packages-mac-taps.txt"

    # Paths to Omarchy-specific auto-generated lists (Option A)
    pacman_file: "{{ chezmoi_source_dir }}/packages-added-pacman.txt"
    aur_file: "{{ chezmoi_source_dir }}/packages-added-aur.txt"
    drivers_file: "{{ chezmoi_source_dir }}/packages-drivers.txt"
    removed_file: "{{ chezmoi_source_dir }}/packages-removed.txt"

  tasks:
    # =========================================================================
    # SECTION 1: COMMON LINUX PACKAGES (Applied to Omarchy & server profiles)
    # =========================================================================
    - name: Install common Linux terminal packages
      community.general.pacman:
        name: "{{ common_linux_packages }}"
        state: present
        update_cache: true
      when: (profile | lower) in ['omarchy', 'server']

    # =========================================================================
    # SECTION 2: MACOS HOMEBREW PACKAGES (Applied only to mac profile)
    # =========================================================================
    - name: Load Mac package lists
      when: (profile | lower) == 'mac'
      block:
        - name: Read mac brew taps list
          ansible.builtin.set_fact:
            mac_brew_taps: "{{ lookup('file', mac_taps_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read mac brew packages list
          ansible.builtin.set_fact:
            mac_brew_packages: "{{ lookup('file', mac_brew_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read mac brew casks list
          ansible.builtin.set_fact:
            mac_brew_casks: "{{ lookup('file', mac_cask_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Add macOS Homebrew taps
          community.general.homebrew_tap:
            name: "{{ item }}"
            state: present
          loop: "{{ mac_brew_taps }}"
          when: mac_brew_taps | length > 0

        - name: Install macOS Homebrew packages
          community.general.homebrew:
            name: "{{ mac_brew_packages }}"
            state: present
          when: mac_brew_packages | length > 0

        - name: Install macOS Homebrew casks
          community.general.homebrew_cask:
            name: "{{ mac_brew_casks }}"
            state: present
          when: mac_brew_casks | length > 0

    # =========================================================================
    # SECTION 3: OMARCHY DYNAMIC PACKAGES (Applied only to Omarchy profile)
    # =========================================================================
    - name: Load Omarchy package lists
      when: (profile | lower) == 'omarchy'
      block:
        - name: Read added pacman packages list
          ansible.builtin.set_fact:
            pacman_packages: "{{ lookup('file', pacman_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read drivers list
          ansible.builtin.set_fact:
            driver_packages: "{{ lookup('file', drivers_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read AUR packages list
          ansible.builtin.set_fact:
            aur_packages: "{{ lookup('file', aur_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read removed packages list
          ansible.builtin.set_fact:
            removed_packages: "{{ lookup('file', removed_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        # 3.1 Install Native Omarchy Packages (Added, Drivers)
        # Note: We do NOT install the base/other packages because those are
        # pre-installed in the OS and contain hardware-specific drivers.
        - name: Install native Omarchy packages (Added, Drivers)
          community.general.pacman:
            name: "{{ pacman_packages + driver_packages }}"
            state: present
          when: (pacman_packages + driver_packages) | length > 0

        # 3.2 Bootstrap yay & Install AUR Packages
        - name: Handle AUR packages
          when: aur_packages | length > 0
          block:
            - name: Ensure base-devel is installed (required for makepkg)
              community.general.pacman:
                name: base-devel
                state: present

            - name: Allow non-root user to run sudo without password temporarily
              ansible.builtin.lineinfile:
                path: /etc/sudoers
                state: present
                line: "{{ non_root_user }} ALL=(ALL) NOPASSWD: ALL"
                validate: '/usr/sbin/visudo -cf %s'

            - name: Check if yay is installed
              ansible.builtin.command: which yay
              register: yay_check
              failed_when: false
              changed_when: false
              become: true
              become_user: "{{ non_root_user }}"

            - name: Bootstrap yay if missing
              become: true
              become_user: "{{ non_root_user }}"
              when: yay_check.rc | default(1) != 0
              block:
                - name: Clone yay-bin
                  ansible.builtin.git:
                    repo: https://aur.archlinux.org/yay-bin.git
                    dest: "/tmp/yay-bin"
                    version: master
                    depth: 1

                - name: Build and install yay
                  ansible.builtin.command:
                    cmd: makepkg -si --noconfirm
                    chdir: "/tmp/yay-bin"

                - name: Remove temporary clone directory
                  ansible.builtin.file:
                    path: "/tmp/yay-bin"
                    state: absent

            - name: Install AUR packages
              ansible.builtin.command:
                cmd: "yay -S --needed --noconfirm {{ aur_packages | join(' ') }}"
              become: true
              become_user: "{{ non_root_user }}"
              register: aur_result
              changed_when: "'Installing' in aur_result.stdout or 'Upgrading' in aur_result.stdout"

          always:
            - name: Revoke passwordless sudo
              ansible.builtin.lineinfile:
                path: /etc/sudoers
                state: absent
                line: "{{ non_root_user }} ALL=(ALL) NOPASSWD: ALL"
                validate: '/usr/sbin/visudo -cf %s'

        # 3.3 Remove Unwanted Packages
        - name: Remove unwanted packages
          community.general.pacman:
            name: "{{ removed_packages }}"
            state: absent
          when: removed_packages | length > 0

    # =========================================================================
    # SECTION 4: OH MY ZSH AND CUSTOM PLUGINS (All Profiles)
    # =========================================================================
    - name: Download Oh My Zsh install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
        dest: /tmp/install_omz.sh
        mode: '0755'
      become: "{{ true if (profile | lower) != 'mac' else false }}"
      become_user: "{{ non_root_user | default(ansible_user_id) }}"

    - name: Run Oh My Zsh install script
      ansible.builtin.command: /tmp/install_omz.sh --unattended
      args:
        creates: "~/.oh-my-zsh"
      become: "{{ true if (profile | lower) != 'mac' else false }}"
      become_user: "{{ non_root_user | default(ansible_user_id) }}"

    - name: Ensure Oh My Zsh custom plugins are installed from source
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "~/{{ item.dest }}"
        depth: 1
        update: true
      become: "{{ true if (profile | lower) != 'mac' else false }}"
      become_user: "{{ non_root_user }}"
      loop:
        - { repo: 'https://github.com/marlonrichert/zsh-autocomplete.git', dest: '.oh-my-zsh/custom/plugins/zsh-autocomplete' }
        - { repo: 'https://github.com/zsh-users/zsh-autosuggestions.git', dest: '.oh-my-zsh/custom/plugins/zsh-autosuggestions' }
        - { repo: 'https://github.com/ocodo/ollama_zsh_completion.git', dest: '.oh-my-zsh/custom/plugins/ollama' }
        - { repo: 'https://github.com/MichaelAquilina/zsh-you-should-use.git', dest: '.oh-my-zsh/custom/plugins/you-should-use' }
        - { repo: 'https://github.com/zsh-users/zsh-syntax-highlighting.git', dest: '.oh-my-zsh/custom/plugins/zsh-syntax-highlighting' }

    # =========================================================================
    # SECTION 5: TMUX AND TOOLS
    # =========================================================================
    - name: Clone Tmuxifier repository
      ansible.builtin.git:
        repo: https://github.com/jimeh/tmuxifier.git
        dest: /tmp/tmuxifier-repo
        depth: 1
        update: true
      become: "{{ true if (profile | lower) != 'mac' else false }}"
      become_user: "{{ non_root_user | default(ansible_user_id) }}"

    - name: Ensure .tmuxifier directory exists
      ansible.builtin.file:
        path: ~/.tmuxifier
        state: directory
        mode: '0755'
      become: "{{ true if (profile | lower) != 'mac' else false }}"
      become_user: "{{ non_root_user | default(ansible_user_id) }}"

    - name: Sync Tmuxifier binaries and libraries to ~/.tmuxifier
      ansible.builtin.shell: |
        rsync -a --checksum --exclude=.git --exclude=layouts /tmp/tmuxifier-repo/ ~/.tmuxifier/
      become: "{{ true if (profile | lower) != 'mac' else false }}"
      become_user: "{{ non_root_user | default(ansible_user_id) }}"
