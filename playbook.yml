---
- name: Bootstrap and Sync Packages
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # `profile` arrives via --extra-vars from the run_onchange wrapper. Normalise
    # once here rather than writing `profile | lower` at every use site.
    p: "{{ profile | lower }}"
    is_mac: "{{ (profile | lower) == 'mac' }}"
    is_linux: "{{ (profile | lower) in ['omarchy', 'server'] }}"
    # Homebrew must not run as root, so every user-scoped task escalates to
    # non_root_user on Linux and stays as the invoking user on macOS.
    as_user: "{{ (profile | lower) != 'mac' }}"

    # 1. Base terminal essentials defined in YAML (Option B)
    # These are installed on ANY Linux system (Omarchy or server)
    common_linux_packages:
      - git
      - zsh
      - tmux
      - ripgrep
      - fzf
      - bat
      - eza
      - yazi
      - lazygit

    # Paths to Mac-specific auto-generated lists
    mac_brew_file: "{{ chezmoi_source_dir }}/packages/mac/brew.txt"
    mac_cask_file: "{{ chezmoi_source_dir }}/packages/mac/casks.txt"
    mac_taps_file: "{{ chezmoi_source_dir }}/packages/mac/taps.txt"

    # Paths to Omarchy-specific auto-generated lists (Option A)
    pacman_file: "{{ chezmoi_source_dir }}/packages/omarchy/added-pacman.txt"
    aur_file: "{{ chezmoi_source_dir }}/packages/omarchy/added-aur.txt"
    # drivers.txt is auto-tracked for reference only — drivers are hardware-
    # specific and must be installed MANUALLY, so the playbook never reads it.
    removed_file: "{{ chezmoi_source_dir }}/packages/omarchy/removed.txt"

    # Paths to server-specific auto-generated lists
    # (regenerate with scripts/update_server_package_lists.sh on the server)
    server_pacman_file: "{{ chezmoi_source_dir }}/packages/server/pacman.txt"
    server_aur_file: "{{ chezmoi_source_dir }}/packages/server/aur.txt"

    # archzfs unofficial binary repo (server ZFS — see SECTION 2.5).
    # Current signing key after the 2024 maintainer change; the old
    # ...F75D9D76 key is deprecated.
    archzfs_key: "3A9917BF0DED5C13F69AC68FABEC0A1208037BE9"
    archzfs_server: "https://github.com/archzfs/archzfs/releases/download/experimental"

  tasks:
    # =========================================================================
    # SECTION 1: COMMON LINUX PACKAGES (Applied to Omarchy & server profiles)
    # =========================================================================
    - name: Install common Linux terminal packages
      community.general.pacman:
        name: "{{ common_linux_packages }}"
        state: present
        update_cache: true
      when: is_linux

    # Arch ships MAKEFLAGS commented out, so makepkg compiles on a single core
    # no matter how many the machine has. Everything AUR that actually builds
    # from source pays for it — llama.cpp-cuda (cmake+cudnn) worst of all.
    # Package compression is already threaded (COMPRESSZST uses -T0).
    - name: Build AUR packages with all available cores
      ansible.builtin.lineinfile:
        path: /etc/makepkg.conf
        regexp: '^#?\s*MAKEFLAGS='
        line: 'MAKEFLAGS="-j$(nproc)"'
        validate: 'bash -n %s'
      when: is_linux

    # =========================================================================
    # SECTION 2: MACOS HOMEBREW PACKAGES (Applied only to mac profile)
    # =========================================================================
    - name: Load Mac package lists
      when: is_mac
      block:
        - name: Read mac brew taps list
          ansible.builtin.set_fact:
            mac_brew_taps: "{{ lookup('file', mac_taps_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read mac brew packages list
          ansible.builtin.set_fact:
            mac_brew_packages: "{{ lookup('file', mac_brew_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read mac brew casks list
          ansible.builtin.set_fact:
            mac_brew_casks: "{{ lookup('file', mac_cask_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Add macOS Homebrew taps
          community.general.homebrew_tap:
            name: "{{ item }}"
            state: present
          loop: "{{ mac_brew_taps }}"
          when: mac_brew_taps | length > 0

        - name: Install macOS Homebrew packages
          community.general.homebrew:
            name: "{{ mac_brew_packages }}"
            state: present
          when: mac_brew_packages | length > 0

        - name: Install macOS Homebrew casks
          community.general.homebrew_cask:
            name: "{{ mac_brew_casks }}"
            state: present
          when: mac_brew_casks | length > 0

    # =========================================================================
    # SECTION 2.5: ZFS VIA ARCHZFS BINARY REPO (server profile only)
    # =========================================================================
    # zfs-dkms/zfs-utils used to be AUR source builds, which failed reliably
    # only on the headless server (PGP key import under makepkg --noconfirm,
    # plus DKMS module builds breaking on kernel/header mismatch). The archzfs
    # repo ships prebuilt, signed binaries instead.
    #
    # IMPORTANT: zfs-linux-lts is a precompiled module for the LTS kernel.
    # The server must BOOT linux-lts (not the regular `linux` kernel) for the
    # module to load — make linux-lts the default boot entry. archzfs is also
    # tagged "experimental" upstream and is version-locked to a specific
    # linux-lts release, so a kernel bump may have to wait for an archzfs build.
    - name: Set up archzfs binary repo and install ZFS (server)
      when: p == 'server'
      block:
        - name: Check whether the archzfs signing key is already trusted
          ansible.builtin.command: "pacman-key --list-keys {{ archzfs_key }}"
          register: archzfs_key_check
          failed_when: false
          changed_when: false

        - name: Receive and locally sign the archzfs signing key
          ansible.builtin.command: "{{ item }}"
          loop:
            - "pacman-key --recv-keys {{ archzfs_key }} --keyserver hkps://keyserver.ubuntu.com"
            - "pacman-key --lsign-key {{ archzfs_key }}"
          when: archzfs_key_check.rc != 0

        - name: Add the archzfs repository to pacman.conf
          ansible.builtin.blockinfile:
            path: /etc/pacman.conf
            marker: "# {mark} ARCHZFS REPO (managed by chezmoi/ansible)"
            block: |
              [archzfs]
              Server = {{ archzfs_server }}

        - name: Refresh package databases now that archzfs is configured
          community.general.pacman:
            update_cache: true

        # One-time migration off the old AUR build. The AUR zfs-dkms pins an
        # exact zfs-utils version; if archzfs ships an older zfs-utils, pacman
        # refuses to install the archzfs stack until zfs-dkms is gone. We only
        # remove the pair when zfs-dkms is still present, so this is a no-op on
        # every subsequent run (and never touches the archzfs zfs-utils).
        - name: Detect leftover AUR-built zfs-dkms (server)
          ansible.builtin.command: pacman -Qq zfs-dkms
          register: zfs_dkms_present
          failed_when: false
          changed_when: false

        - name: Remove the old AUR ZFS stack so archzfs can take over (server)
          community.general.pacman:
            name:
              - zfs-dkms
              - zfs-utils
            state: absent
          when: zfs_dkms_present.rc == 0

        - name: Install ZFS from archzfs (prebuilt, matched to linux-lts)
          community.general.pacman:
            name:
              - zfs-linux-lts
              - zfs-utils
            state: present

    # =========================================================================
    # SECTION 2.6: DRIVER MIGRATIONS (server profile only)
    # =========================================================================
    # nvidia-open-lts (prebuilt for the LTS kernel) provides NVIDIA-MODULE and
    # conflicts with the DKMS package it replaces. pacman --noconfirm can't
    # answer the "Remove nvidia-open-dkms?" prompt, so remove it ourselves
    # first. Guarded on the DKMS package being present, so it's a one-time
    # migration and a no-op afterwards.
    - name: Detect leftover nvidia-open-dkms (server)
      ansible.builtin.command: pacman -Qq nvidia-open-dkms
      register: nvidia_dkms_present
      failed_when: false
      changed_when: false
      when: p == 'server'

    - name: Remove nvidia-open-dkms so nvidia-open-lts can take over (server)
      community.general.pacman:
        name: nvidia-open-dkms
        state: absent
      when:
        - p == 'server'
        - nvidia_dkms_present.rc | default(1) == 0

    # =========================================================================
    # SECTION 3: DYNAMIC PACKAGES (Applied to Omarchy & server profiles)
    # =========================================================================
    - name: Load dynamic package lists
      when: is_linux
      block:
        - name: Select package lists for this profile
          ansible.builtin.set_fact:
            profile_pacman_file: "{{ server_pacman_file if p == 'server' else pacman_file }}"
            profile_aur_file: "{{ server_aur_file if p == 'server' else aur_file }}"

        - name: Read added pacman packages list
          ansible.builtin.set_fact:
            pacman_packages: "{{ lookup('file', profile_pacman_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read AUR packages list
          ansible.builtin.set_fact:
            aur_packages: "{{ lookup('file', profile_aur_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list }}"

        - name: Read removed packages list (Omarchy only)
          ansible.builtin.set_fact:
            removed_packages: "{{ (lookup('file', removed_file).splitlines() | reject('match', '^#') | reject('match', '^$') | list) if (profile | lower) == 'omarchy' else [] }}"

        # 3.1 Install Native Packages (Added only)
        # Note: We do NOT install the base/other packages because those are
        # pre-installed in the OS. Drivers (drivers.txt) are also NOT installed
        # here — they are hardware-specific and must be installed manually. The
        # list is still auto-tracked by scripts/sync-package-lists.sh for
        # reference, but chezmoi/ansible never touches driver packages.
        - name: Install native packages (Added)
          community.general.pacman:
            name: "{{ pacman_packages }}"
            state: present
          when: pacman_packages | length > 0

        # 3.2 Bootstrap yay & Install AUR Packages
        #
        # Missing packages are computed locally against `pacman -Qq` so a
        # fully-synced machine skips this entire block (no yay invocations,
        # no AUR network queries, no sudoers churn). Everything missing is
        # then installed in ONE yay run with --batchinstall so ALPM hooks
        # (MIME/desktop/icon-cache database updates) fire once per run
        # instead of once per package — this was the big AUR slowdown.
        - name: List installed packages
          ansible.builtin.command: pacman -Qq
          register: installed_packages
          changed_when: false
          when: aur_packages | length > 0

        # yay-bin bootstraps itself below; feeding it back into yay is a no-op
        - name: Determine missing AUR packages
          ansible.builtin.set_fact:
            aur_missing_packages: "{{ aur_packages | reject('equalto', 'yay-bin') | list | difference(installed_packages.stdout_lines) }}"
          when: aur_packages | length > 0

        - name: Install missing AUR packages
          when: aur_missing_packages | default([]) | length > 0
          block:
            - name: Ensure base-devel is installed (required for makepkg)
              community.general.pacman:
                name: base-devel
                state: present

            - name: Allow non-root user to run sudo without password temporarily
              ansible.builtin.copy:
                dest: /etc/sudoers.d/99-chezmoi-aur-temp
                content: "{{ non_root_user }} ALL=(ALL) NOPASSWD: ALL\n"
                mode: '0440'
                validate: '/usr/sbin/visudo -cf %s'

            - name: Check if yay is installed
              ansible.builtin.command: yay --version
              register: yay_check
              failed_when: false
              changed_when: false
              become: true
              become_user: "{{ non_root_user }}"

            - name: Bootstrap yay if missing
              become: true
              become_user: "{{ non_root_user }}"
              when: yay_check.rc | default(1) != 0
              block:
                - name: Clone yay-bin
                  ansible.builtin.git:
                    repo: https://aur.archlinux.org/yay-bin.git
                    dest: "/tmp/yay-bin"
                    version: master
                    depth: 1

                - name: Build and install yay
                  ansible.builtin.command:
                    cmd: makepkg -si --noconfirm
                    chdir: "/tmp/yay-bin"

                - name: Remove temporary clone directory
                  ansible.builtin.file:
                    path: "/tmp/yay-bin"
                    state: absent

            # Signed AUR sources (e.g. zfs-dkms) need their PGP keys fetched at
            # build time; the default keyserver can stall dirmngr indefinitely.
            - name: Ensure ~/.gnupg exists for the build user
              ansible.builtin.file:
                path: "~{{ non_root_user }}/.gnupg"
                state: directory
                mode: '0700'
              become: true
              become_user: "{{ non_root_user }}"

            - name: Point GPG at a reliable keyserver for AUR key imports
              ansible.builtin.lineinfile:
                path: "~{{ non_root_user }}/.gnupg/gpg.conf"
                line: "keyserver hkps://keyserver.ubuntu.com"
                create: true
                mode: '0600'
              become: true
              become_user: "{{ non_root_user }}"

            # A hard async timeout so a stalled build/keyserver can never
            # hang the playbook forever.
            - name: Install AUR packages ({{ aur_missing_packages | default([]) | join(', ') }})
              ansible.builtin.command:
                cmd: "yay -S --needed --noconfirm --noprogressbar --batchinstall {{ aur_missing_packages | join(' ') }}"
              become: true
              become_user: "{{ non_root_user }}"
              async: 7200
              poll: 15
              changed_when: true

          always:
            - name: Revoke passwordless sudo
              ansible.builtin.file:
                path: /etc/sudoers.d/99-chezmoi-aur-temp
                state: absent

        # 3.3 Remove Unwanted Packages
        - name: Remove unwanted packages
          community.general.pacman:
            name: "{{ removed_packages }}"
            state: absent
          when: removed_packages | length > 0

    # =========================================================================
    # SECTION 4: OH MY ZSH AND CUSTOM PLUGINS (All Profiles)
    # =========================================================================
    - name: Check whether Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "~{{ non_root_user }}/.oh-my-zsh/oh-my-zsh.sh"
      register: omz_check

    - name: Install Oh My Zsh
      when: not omz_check.stat.exists
      block:
        - name: Download Oh My Zsh install script
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
            dest: /tmp/install_omz.sh
            mode: '0755'
          become: "{{ as_user }}"
          become_user: "{{ non_root_user }}"

        - name: Run Oh My Zsh install script
          ansible.builtin.shell: |
            export HOME=$(getent passwd {{ non_root_user }} | cut -d: -f6)
            export ZSH="$HOME/.oh-my-zsh"
            export KEEP_ZSHRC=yes

            if [ -d "$ZSH" ]; then
              mv "$ZSH" "${ZSH}.chezmoi_bak"
            fi

            /tmp/install_omz.sh --unattended

            if [ -d "${ZSH}.chezmoi_bak" ]; then
              rsync -a "${ZSH}.chezmoi_bak/" "$ZSH/"
              rm -rf "${ZSH}.chezmoi_bak"
            fi
          become: "{{ as_user }}"
          become_user: "{{ non_root_user }}"

    - name: Ensure Oh My Zsh custom plugins are installed from source
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "~{{ non_root_user }}/{{ item.dest }}"
        depth: 1
        update: true
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"
      loop:
        - { repo: 'https://github.com/marlonrichert/zsh-autocomplete.git', dest: '.oh-my-zsh/custom/plugins/zsh-autocomplete' }
        - { repo: 'https://github.com/zsh-users/zsh-autosuggestions.git', dest: '.oh-my-zsh/custom/plugins/zsh-autosuggestions' }
        - { repo: 'https://github.com/MichaelAquilina/zsh-you-should-use.git', dest: '.oh-my-zsh/custom/plugins/you-should-use' }
        - { repo: 'https://github.com/zsh-users/zsh-syntax-highlighting.git', dest: '.oh-my-zsh/custom/plugins/zsh-syntax-highlighting' }

    # =========================================================================
    # SECTION 5: TMUX AND TOOLS
    # =========================================================================
    - name: Clone Tmuxifier repository
      ansible.builtin.git:
        repo: https://github.com/jimeh/tmuxifier.git
        dest: /tmp/tmuxifier-repo
        depth: 1
        update: true
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"

    - name: Ensure .tmuxifier directory exists
      ansible.builtin.file:
        path: "~{{ non_root_user }}/.tmuxifier"
        state: directory
        mode: '0755'
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"

    # --itemize-changes prints one line per file it actually touches, so an
    # already-synced run produces no output and reports ok instead of changed.
    # Without this the task reports changed every single run.
    # shell, not command: the destination uses ~user tilde expansion.
    - name: Sync Tmuxifier binaries and libraries to user home
      ansible.builtin.shell: |
        rsync -a --checksum --itemize-changes --exclude=.git --exclude=layouts \
          /tmp/tmuxifier-repo/ ~{{ non_root_user }}/.tmuxifier/
      register: tmuxifier_sync
      changed_when: tmuxifier_sync.stdout | trim | length > 0
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"

    # =========================================================================
    # SECTION 6: AI CLI TOOLS
    # =========================================================================
    - name: Install Claude CLI
      ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: "~{{ non_root_user }}/.local/bin/claude"
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"

    - name: Install ChatGPT Codex CLI
      ansible.builtin.shell: curl -fsSL https://chatgpt.com/codex/install.sh | sh
      args:
        creates: "~{{ non_root_user }}/.local/bin/codex"
      become: "{{ as_user }}"
      become_user: "{{ non_root_user }}"

    # =========================================================================
    # SECTION 7: PACKAGE LIST AUTO-SYNC (Omarchy & server profiles)
    # =========================================================================
    # A pacman PostTransaction hook that regenerates this repo's package
    # lists and commits them whenever packages are installed or removed
    # manually — no more remembering to run scripts/update_*_package_lists.sh.
    # The hook drops privileges back to the login user and delegates to
    # scripts/sync-package-lists.sh in the chezmoi source dir.
    - name: Install package-list auto-sync pacman hook
      when: is_linux
      block:
        - name: Ensure the pacman hook directory exists
          ansible.builtin.file:
            path: /etc/pacman.d/hooks
            state: directory
            mode: '0755'

        # zz- prefix so it sorts (and therefore runs) after other hooks
        - name: Install the package-list sync hook
          ansible.builtin.copy:
            dest: /etc/pacman.d/hooks/zz-chezmoi-package-sync.hook
            mode: '0644'
            content: |
              [Trigger]
              Operation = Install
              Operation = Remove
              Type = Package
              Target = *

              [Action]
              Description = Syncing chezmoi package lists...
              When = PostTransaction
              Exec = /usr/bin/runuser -u {{ non_root_user }} -- {{ chezmoi_source_dir }}/scripts/sync-package-lists.sh
